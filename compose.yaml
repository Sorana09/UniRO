version: '3.8'

networks:
  personalized_learning_db:
    driver: bridge

services:
  db:
    container_name: personalized_learning_db
    hostname: personalized_learning_db
    networks:
      - personalized_learning_db
    image: postgres:latest
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ChangeMe
      POSTGRES_DB: personalized_learning_db


  admin:
    container_name: personalized_learning_admin
    image: adminer
    networks:
      - personalized_learning_db
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"

  grafana:
    container_name: personalized_learning_grafana
    image: grafana/grafana
    restart: always
    ports:
      - "3001:3000"
    networks:
      - personalized_learning_db
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana

  prometheus:
    container_name: personalized_learning_prometheus
    image: prom/prometheus
    restart: always
    ports:
      - "9090:9090"
    networks:
      - personalized_learning_db
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  loki:
    container_name: personalized_learning_loki
    image: grafana/loki:latest
    ports:
      - "3110:3100"
    networks:
      - personalized_learning_db
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml

  promtail:
    container_name: personalized_learning_promtail
    image: grafana/promtail:latest
    networks:
      - personalized_learning_db
    volumes:
      - /var/log:/var/log
      - ./promtail-config.yml:/etc/promtail/config.yml
    command:
      - "-config.file=/etc/promtail/config.yml"

  tempo:
    container_name: personalized_learning_tempo
    image: grafana/tempo:latest
    restart: always
    networks:
      - personalized_learning_db
    command:
      - "-config.file=/etc/tempo-config.yml"
    volumes:
      - ./tempo-config.yml:/etc/tempo-config.yml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "3200:3200"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command:
      - "--config=/etc/otel-collector-config.yml"
    networks:
      - personalized_learning_db
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317"
      - "8889:8889"

volumes:
  grafana-data:
