version: '3.8'

networks:
  personalized_learning_db:
    driver: bridge

services:
  db:
    container_name: personalized_learning_db
    hostname: personalized_learning_db
    networks:
      - personalized_learning_db
    image: postgres:latest
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ChangeMe
      POSTGRES_DB: personalized_learning_db

  admin:
    container_name: personalized_learning_admin
    image: adminer
    networks:
      - personalized_learning_db
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"

  otel-lgtm:
    container_name: personalized_learning_otel-lgtm
    image: grafana/otel-lgtm:latest
    networks:
      - personalized_learning_db
    restart: always
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

volumes:
  grafana-data:
