version: '3'

networks:
  personalized_learning_db:
    driver: bridge

services:
  db:
    hostname: personalized_learning_db
    networks:
      - personalized_learning_db
    image: postgres:latest
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ChangeMe
      POSTGRES_DB: personalized_learning_db

  admin:
    image: adminer
    networks:
      - personalized_learning_db
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"

  grafana:
    image: grafana/grafana
    restart: always
    ports:
      - "3001:3000"
    networks:
      - personalized_learning_db
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana

  prometheus:
    image: prom/prometheus
    restart: always
    ports:
      - "9090:9090"
    networks:
      - personalized_learning_db
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'  # Opțional, specifică locația de stocare
      - '--web.listen-address=:9090'

volumes:
  grafana-data:
