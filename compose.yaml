networks:
  personalized_learning_db:
    driver: bridge
services:
  db:
    hostname: personalized_learning_db
    networks:
      - personalized_learning_db
    image: postgres:latest
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ChangeMe
      POSTGRES_DB: personalized_learning_db
  admin:
    image: adminer
    networks:
      - personalized_learning_db
    restart: always
    depends_on:
      - db
    ports:
      - 8080:8080