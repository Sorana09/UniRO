spring.application.name=personalized_learning_db
server.port=8090
spring.datasource.url=jdbc:postgresql://localhost:5433/personalized_learning_db
spring.datasource.username=admin
spring.datasource.password=ChangeMe
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.main.allow-bean-definition-overriding=true
# spring.jackson.property-naming-strategy=SNAKE_CASE
spring.sql.init.schema-locations=classpath:/db/migration/entity.sql

limiterx.storage=memory

management.endpoints.web.exposure.include=*

# Enable tracing
management.tracing.sampling.probability=1.0


# New Redis configuration
spring.data.redis.host=redis
spring.data.redis.port=6379

# Enable caching
spring.cache.type=redis

